<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>配置さん</title>
  <meta name="description" content="ビリヤードのボール配置を並べて保存・共有するアプリ">
  <meta name="theme-color" content="#111418">
  <meta name="apple-mobile-web-app-title" content="配置さん">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand"><img src="icons/icon.svg" alt="" width="24" height="24">配置さん</h1>
    <span id="status" class="status"></span>
    <button id="btnSettings">設定</button>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="layout" aria-selected="true">配置</button>
    <button role="tab" data-tab="camera" aria-selected="false">カメラ</button>
  </nav>

  <main>
    <!-- 配置: ボールを手で並べて保存・共有する (メイン) -->
    <section class="tab-panel layout-tab" id="tab-layout">
      <div class="table-area">
        <div class="title-row">
          <input id="titleInput" class="title-input" placeholder="タイトル (例: 2025 世界選手権 決勝 第7ラック)" maxlength="100">
        </div>
        <details class="memo">
          <summary>メモ</summary>
          <textarea id="memoInput" rows="3" maxlength="500" placeholder="試合名・選手・年・出典など"></textarea>
        </details>
        <div class="table-wrap"><canvas id="top"></canvas></div>
        <div class="palette" id="palette" aria-label="ボール"></div>
        <div class="toolbar quick" id="quickActions">
          <button id="btnUndo" disabled>元に戻す</button>
          <button id="btnShare" class="primary">URLで共有</button>
          <button id="btnSaveLayout">保存</button>
        </div>
        <p class="hint" id="layoutHint"></p>
      </div>

      <div class="side">
        <div class="toolbar">
          <button id="btnDeleteBall">選択を削除</button>
          <button id="btnClearBalls">全消去</button>
        </div>
        <div class="toolbar">
          <select id="tableSize" title="台サイズ"></select>
          <label><input type="checkbox" id="chkGridPoint"> ポイント線</label>
          <label><input type="checkbox" id="chkGridHalf"> 半ポイント線</label>
        </div>

        <h3>保存した配置</h3>
        <div class="toolbar">
          <select id="layoutSelect" title="保存済みの配置"></select>
          <button id="btnLoadLayout">読込</button>
          <button id="btnDeleteLayout">削除</button>
        </div>
        <div class="toolbar">
          <button id="btnExport">JSON保存</button>
          <button id="btnExportAll">保存データを書き出し</button>
          <label class="btn">JSON読込<input type="file" id="importInput" accept="application/json,.json" hidden></label>
        </div>

        <details class="coords">
          <summary>ボール座標</summary>
          <table class="ball-list">
            <thead><tr><th>ボール</th><th>x (mm)</th><th>y (mm)</th><th></th></tr></thead>
            <tbody id="ballList"></tbody>
          </table>
        </details>
      </div>
    </section>

    <!-- カメラ: 写真・カメラから読み取り / 実際の台に重ねて表示 (オプション) -->
    <section class="tab-panel panel" id="tab-camera" hidden>
      <div class="toolbar">
        <select id="cameraSelect" title="カメラ"></select>
        <button id="btnCamera">カメラ開始</button>
        <button id="btnFreeze" disabled>静止</button>
        <label class="btn">画像を開く<input type="file" id="fileInput" accept="image/*" hidden></label>
      </div>
      <div class="toolbar">
        <button id="btnEditCorners">角を指定</button>
        <button id="btnRotate" title="台の長辺/向きが逆のとき">角の割当を回転</button>
        <button id="btnAutoCorners">AIで角検出</button>
        <button id="btnClearCorners">角クリア</button>
      </div>
      <div class="toolbar">
        <button id="btnDetect" class="primary">ボール検出</button>
        <label><input type="checkbox" id="chkAuto"> 連続検出</label>
        <label><input type="number" id="autoInterval" min="2" step="1" value="5"> 秒間隔</label>
      </div>

      <div class="stage">
        <canvas id="view"></canvas>
        <div class="placeholder" id="placeholder">カメラを開始するか画像を開いてください。<br>台の4隅を指定すると、「配置」タブの配置を実際の台に重ねて表示します。</div>
      </div>

      <div class="toolbar">
        <label>重ね合わせ <input type="range" id="opacity" min="0" max="1" step="0.05" value="0.7"></label>
        <label><input type="checkbox" id="chkTable" checked> 台</label>
        <label><input type="checkbox" id="chkBalls" checked> ボール</label>
        <label><input type="checkbox" id="chkLabels" checked> 番号</label>
        <label><input type="checkbox" id="chkBoxes"> 検出枠</label>
        <label><input type="checkbox" id="chkBg"> 仮想台の背景にカメラ補正画像</label>
      </div>
      <p class="hint" id="hint"></p>
    </section>
  </main>

  <dialog id="settingsDialog">
    <form method="dialog">
      <h2>設定</h2>
      <label class="field">Gemini API キー
        <input type="password" id="apiKey" autocomplete="off" spellcheck="false">
      </label>
      <label class="field">モデル
        <span class="row">
          <input id="model" list="modelList" spellcheck="false">
          <button type="button" id="btnListModels">一覧を取得</button>
        </span>
      </label>
      <p class="note" id="modelStatus"></p>
      <datalist id="modelList">
        <option value="gemini-3.8-flash">
        <option value="gemini-3.5-flash">
        <option value="gemini-3.1-pro-preview">
        <option value="gemini-3.1-flash-lite-preview">
      </datalist>
      <label><input type="checkbox" id="refineNumbers"> ボールを拡大して番号を再判定する (API 呼び出し +1 回)</label>
      <label><input type="checkbox" id="uniqueNumbers"> 番号を重複させない</label>
      <fieldset>
        <legend>カスタム台サイズ (プレイエリア, mm)</legend>
        <label>長辺 <input type="number" id="customL" min="500" step="1"></label>
        <label>短辺 <input type="number" id="customW" min="250" step="1"></label>
      </fieldset>
      <p class="note">API キーはこのブラウザの IndexedDB に保存され、Google の API へ直接送信されます。空欄で保存すると削除します。</p>
      <menu>
        <button value="cancel" formnovalidate>キャンセル</button>
        <button value="ok" class="primary">保存</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
