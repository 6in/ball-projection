<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ball Projection</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Ball Projection</h1>
    <span id="status" class="status"></span>
    <button id="btnSettings">設定</button>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="panel-head"><h2>カメラ / 画像</h2></div>
      <div class="toolbar">
        <select id="cameraSelect" title="カメラ"></select>
        <button id="btnCamera">カメラ開始</button>
        <button id="btnFreeze" disabled>静止</button>
        <label class="btn">画像を開く<input type="file" id="fileInput" accept="image/*" hidden></label>
      </div>
      <div class="toolbar">
        <button id="btnEditCorners">角を指定</button>
        <button id="btnRotate" title="台の長辺/向きが逆のとき">角の割当を回転</button>
        <button id="btnAutoCorners">AIで角検出</button>
        <button id="btnClearCorners">角クリア</button>
      </div>
      <div class="toolbar">
        <button id="btnDetect" class="primary">ボール検出</button>
        <label><input type="checkbox" id="chkAuto"> 連続検出</label>
        <label><input type="number" id="autoInterval" min="2" step="1" value="5"> 秒間隔</label>
      </div>

      <div class="stage">
        <canvas id="view"></canvas>
        <div class="placeholder" id="placeholder">カメラを開始するか画像を開いてください</div>
      </div>

      <div class="toolbar">
        <label>重ね合わせ <input type="range" id="opacity" min="0" max="1" step="0.05" value="0.7"></label>
        <label><input type="checkbox" id="chkTable" checked> 台</label>
        <label><input type="checkbox" id="chkBalls" checked> ボール</label>
        <label><input type="checkbox" id="chkLabels" checked> 番号</label>
        <label><input type="checkbox" id="chkBoxes"> 検出枠</label>
      </div>
      <p class="hint" id="hint"></p>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>仮想台</h2>
        <select id="tableSize" title="台サイズ"></select>
      </div>
      <canvas id="top"></canvas>
      <div class="toolbar">
        <label><input type="checkbox" id="chkBg"> カメラ補正画像を背景に表示</label>
      </div>
      <div class="toolbar">
        <select id="addBallSelect" title="追加するボール"></select>
        <button id="btnAddBall">ボール追加</button>
        <button id="btnDeleteBall">選択を削除</button>
        <button id="btnClearBalls">全消去</button>
      </div>
      <div class="toolbar">
        <select id="layoutSelect" title="保存済みの配置"></select>
        <button id="btnLoadLayout">読込</button>
        <button id="btnSaveLayout">名前を付けて保存</button>
        <button id="btnDeleteLayout">削除</button>
      </div>
      <div class="toolbar">
        <button id="btnExport">JSON保存</button>
        <label class="btn">JSON読込<input type="file" id="importInput" accept="application/json,.json" hidden></label>
      </div>
      <table class="ball-list">
        <thead><tr><th>ボール</th><th>x (mm)</th><th>y (mm)</th><th></th></tr></thead>
        <tbody id="ballList"></tbody>
      </table>
    </section>
  </main>

  <dialog id="settingsDialog">
    <form method="dialog">
      <h2>設定</h2>
      <label class="field">Gemini API キー
        <input type="password" id="apiKey" autocomplete="off" spellcheck="false">
      </label>
      <label class="field">モデル
        <input id="model" list="modelList" spellcheck="false">
      </label>
      <datalist id="modelList">
        <option value="gemini-2.5-flash">
        <option value="gemini-2.5-pro">
        <option value="gemini-2.5-flash-lite">
      </datalist>
      <fieldset>
        <legend>カスタム台サイズ (プレイエリア, mm)</legend>
        <label>長辺 <input type="number" id="customL" min="500" step="1"></label>
        <label>短辺 <input type="number" id="customW" min="250" step="1"></label>
      </fieldset>
      <p class="note">API キーはこのブラウザの IndexedDB に保存され、Google の API へ直接送信されます。空欄で保存すると削除します。</p>
      <menu>
        <button value="cancel" formnovalidate>キャンセル</button>
        <button value="ok" class="primary">保存</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
